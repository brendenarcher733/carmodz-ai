[pytest]
; Puts backend/ itself on sys.path regardless of whether pytest is invoked
; as `pytest` or `python -m pytest` — needed since the app's own code
; (main.py, routers/*, core/*) uses absolute imports like `from core.config
; import settings`, which only resolve if backend/ (not backend/tests/) is
; importable.
pythonpath = .
testpaths = tests
